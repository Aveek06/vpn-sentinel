<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Sentinel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EEEAE0;
      --surface: #F6F3EA;
      --text: #0C0C0C;
      --muted: rgba(12,12,12,0.45);
      --border: #0C0C0C;
      --accent: #FF1500;
      --green: #007A30;
      --shadow: 5px 5px 0 var(--border);
      --shadow-lg: 7px 7px 0 var(--border);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111111;
        --surface: #1C1C1C;
        --text: #E5E0D0;
        --muted: rgba(229,224,208,0.4);
        --border: #E5E0D0;
        --shadow: 5px 5px 0 var(--border);
        --shadow-lg: 7px 7px 0 var(--border);
      }
    }

    :root[data-theme="dark"] {
      --bg: #111111;
      --surface: #1C1C1C;
      --text: #E5E0D0;
      --muted: rgba(229,224,208,0.4);
      --border: #E5E0D0;
      --shadow: 5px 5px 0 var(--border);
      --shadow-lg: 7px 7px 0 var(--border);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', 'Courier New', monospace;
      padding: clamp(1rem, 4vw, 3rem);
      min-height: 100vh;
    }

    /* HEADER */
    .hdr {
      display: flex;
      align-items: flex-end;
      gap: clamp(1rem, 3vw, 2.5rem);
      border-bottom: 4px solid var(--border);
      padding-bottom: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .hdr-title {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .hdr-title .dot { color: var(--accent); }

    .hdr-meta { padding-bottom: 0.5rem; }

    .hdr-meta p {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.9;
    }

    .byline {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: auto;
      padding-bottom: 0.5rem;
      align-self: flex-end;
      white-space: nowrap;
    }

    .byline span { color: var(--text); font-weight: 700; }

    /* INPUT */
    .input-block {
      display: grid;
      grid-template-columns: 1fr auto;
      border: 3px solid var(--border);
      box-shadow: var(--shadow-lg);
      margin-bottom: 1.75rem;
    }

    textarea {
      background: var(--surface);
      border: none;
      border-right: 3px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.8;
      min-height: 130px;
      outline: none;
      padding: 1.1rem 1.3rem;
      resize: vertical;
      width: 100%;
    }

    textarea::placeholder { color: var(--muted); }
    textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }

    .scan-btn {
      background: var(--text);
      border: none;
      color: var(--bg);
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.14em;
      padding: 1.25rem 1.5rem;
      writing-mode: vertical-lr;
      transition: background 0.08s, color 0.08s;
      user-select: none;
    }

    .scan-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
    .scan-btn:active:not(:disabled) { transform: translate(2px, 2px); }
    .scan-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .hint {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.75rem;
      text-align: right;
    }

    /* PROGRESS */
    .prog-wrap {
      border: 3px solid var(--border);
      height: 12px;
      margin-bottom: 1.75rem;
      overflow: hidden;
      display: none;
    }

    .prog-fill {
      background: var(--text);
      height: 100%;
      width: 0;
      transition: width 0.2s ease, background 0.4s;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .stat {
      padding: 1.1rem 1.5rem;
      border-right: 3px solid var(--border);
    }

    .stat:last-child { border-right: none; }

    .stat-lbl {
      font-size: 0.56rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-num.danger { color: var(--accent); }
    .stat-num.safe   { color: var(--green); }

    /* TABLE */
    .tbl-wrap {
      overflow-x: auto;
      border: 3px solid var(--border);
      box-shadow: var(--shadow-lg);
    }

    table { border-collapse: collapse; width: 100%; min-width: 580px; }

    thead tr { background: var(--text); }

    th {
      color: var(--bg);
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      padding: 0.85rem 1rem;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      border-top: 2px solid var(--border);
      font-size: 0.74rem;
      padding: 0.7rem 1rem;
      vertical-align: middle;
    }

    tr.is-flagged td { background: rgba(255,21,0,0.055); }

    .ip-val { font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }

    /* BADGES */
    .badges { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    .badge {
      border: 2px solid;
      display: inline-block;
      font-size: 0.54rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 0.15rem 0.4rem;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .b-vpn   { border-color: #FF1500; color: #FF1500; }
    .b-proxy { border-color: #CC5500; color: #CC5500; }
    .b-tor   { border-color: #7700CC; color: #7700CC; }
    .b-relay { border-color: #996600; color: #996600; }
    .b-clean     { border-color: var(--green); color: var(--green); }
    .b-err       { border-color: var(--muted); color: var(--muted); }
    .b-suspected { border-color: #E07800; color: #E07800; }

    /* PROVIDER BREAKDOWN */
    .prov-panel {
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      background: var(--surface);
    }

    .prov-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.25rem;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      width: 100%;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: left;
    }

    .prov-toggle:hover { background: rgba(128,128,128,0.08); }

    .prov-caret { transition: transform 0.15s; display: inline-block; }
    .prov-toggle.open .prov-caret { transform: rotate(90deg); }

    .prov-body { border-top: 3px solid var(--border); overflow-x: auto; }
    .prov-body table { min-width: 400px; }
    .prov-body th { font-size: 0.55rem; letter-spacing: 0.18em; padding: 0.6rem 1rem; }
    .prov-body td { font-size: 0.7rem; padding: 0.55rem 1rem; font-variant-numeric: tabular-nums; }
    .prov-name { font-weight: 700; }
    .prov-flag { color: var(--accent); font-weight: 700; }
    .prov-dim  { color: var(--muted); }

    /* EXPORT BAR */
    .export-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      padding: 0.8rem 1.25rem;
      background: var(--surface);
    }

    .export-lbl {
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1;
    }

    .export-lbl strong {
      font-weight: 700;
      color: var(--accent);
    }

    .export-btns { display: flex; }

    .exp-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-right: none;
      color: var(--text);
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      padding: 0.35rem 1.1rem;
      transition: background 0.08s, color 0.08s;
    }

    .exp-btn:last-child { border-right: 2px solid var(--border); }
    .exp-btn:hover { background: var(--text); color: var(--bg); }
    .exp-btn:active { transform: translate(1px, 1px); }

    /* EMPTY STATE */
    .empty {
      border: 3px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 4rem 2rem 3.5rem;
      text-align: center;
    }

    .empty-glyph {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 20vw, 11rem);
      line-height: 1;
      opacity: 0.1;
      display: block;
    }

    .empty p {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    /* RESPONSIVE */
    @media (max-width: 560px) {
      .input-block { grid-template-columns: 1fr; }
      .scan-btn {
        writing-mode: horizontal-tb;
        padding: 1rem;
        font-size: 1.8rem;
        letter-spacing: 0.2em;
        border-top: 3px solid var(--border);
      }
      .hdr { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }

    /* STATUS MODAL */
    .status-btn {
      background: none;
      border: 2px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 0.3rem 0.75rem;
      text-transform: uppercase;
      align-self: flex-end;
      margin-bottom: 0.5rem;
      margin-left: 1rem;
      white-space: nowrap;
    }
    .status-btn:hover { background: var(--text); color: var(--bg); }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 3px solid var(--border);
      box-shadow: var(--shadow-lg);
      width: min(480px, 94vw);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.25rem;
      border-bottom: 3px solid var(--border);
    }

    .modal-hdr h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
    }

    .modal-close {
      background: none; border: none; cursor: pointer;
      font-size: 1.3rem; color: var(--text); line-height: 1;
    }

    .modal-body { padding: 1rem 1.25rem; }

    .prov-status-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(128,128,128,0.15);
      font-size: 0.72rem;
    }

    .prov-status-row:last-child { border-bottom: none; }

    .prov-status-name { flex: 1; font-weight: 700; }

    .prov-dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    }

    .dot-active   { background: var(--green); }
    .dot-exhausted { background: var(--accent); }
    .dot-nokey    { background: var(--muted); }

    .prov-state-lbl {
      font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); width: 80px; text-align: right;
    }

    .reset-btn {
      display: block; width: 100%; margin-top: 1rem;
      background: var(--text); border: none; color: var(--bg);
      cursor: pointer; font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; letter-spacing: 0.14em; padding: 0.6rem;
    }

    .reset-btn:hover { background: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="hdr">
    <h1 class="hdr-title">VPN<span class="dot">.</span>SENTINEL</h1>
    <div class="hdr-meta">
      <p>IP Intelligence / Threat Detection</p>
      <p>Powered by FindIP</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;margin-left:auto">
      <p class="byline" style="margin-left:0">Made by <span>Aveek</span></p>
      <button class="status-btn" onclick="openStatus()">Provider Status</button>
    </div>
  </header>

  <div class="modal-overlay" id="status-modal" hidden onclick="if(event.target===this)closeStatus()">
    <div class="modal">
      <div class="modal-hdr">
        <h2>Provider Status</h2>
        <button class="modal-close" onclick="closeStatus()">✕</button>
      </div>
      <div class="modal-body" id="status-body">
        <p style="font-size:0.7rem;color:var(--muted)">Loading…</p>
      </div>
    </div>
  </div>

  <div class="input-block">
    <textarea id="ip-input" spellcheck="false"
      placeholder="Paste IPs — one per line or comma-separated&#10;&#10;1.1.1.1&#10;8.8.8.8, 104.28.0.1&#10;2606:4700:4700::1111"></textarea>
    <button class="scan-btn" id="scan-btn" onclick="runScan()">SCAN</button>
  </div>

  <p class="hint">Ctrl + Enter to scan &nbsp;·&nbsp; IPv4 and IPv6 supported</p>

  <div class="prog-wrap" id="prog-wrap">
    <div class="prog-fill" id="prog-fill"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-lbl">Total Scanned</div>
      <div class="stat-num" id="st-total">0</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Flagged</div>
      <div class="stat-num danger" id="st-flagged">0</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Clean</div>
      <div class="stat-num safe" id="st-clean">0</div>
    </div>
  </div>

  <div class="prov-panel" id="provider-breakdown" hidden>
    <button class="prov-toggle" id="prov-toggle" onclick="toggleProvPanel()">
      <span>Provider Breakdown</span>
      <span class="prov-caret">▶</span>
    </button>
    <div id="prov-body" hidden>
      <div class="prov-body">
        <table>
          <thead>
            <tr>
              <th>Provider</th>
              <th>Answered</th>
              <th>Flagged</th>
              <th>Clean</th>
              <th>Flag Rate</th>
            </tr>
          </thead>
          <tbody id="prov-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="export-bar" id="export-bar" hidden>
    <span class="export-lbl">Export <strong id="export-count">0</strong> flagged IPs as</span>
    <div class="export-btns">
      <button class="exp-btn" onclick="exportFile('txt')" title="One IP per line">TXT</button>
      <button class="exp-btn" onclick="exportFile('csv')" title="IP, flags, country, city, ISP">CSV</button>
      <button class="exp-btn" onclick="exportFile('json')" title="Full structured data">JSON</button>
    </div>
  </div>

  <div id="results-area">
    <div class="empty">
      <span class="empty-glyph">?</span>
      <p>Enter IPs above and hit scan</p>
    </div>
  </div>


  <script>
    let scanning = false;
    let allResults = [];

    function parseIPs(raw) {
      return [...new Set(
        raw.split(/[\n,\s]+/)
           .map(s => s.trim())
           .filter(s => s.length > 2 && /^[0-9a-fA-F.:]+$/.test(s))
      )];
    }

    async function checkBatch(ips) {
      try {
        const r = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ips }),
        });
        if (!r.ok) {
          const msg = await r.text().catch(() => `HTTP ${r.status}`);
          throw new Error(msg);
        }
        return r.json();
      } catch (e) {
        return ips.map(ip => ({ ip, vpn: false, proxy: false, tor: false, relay: false,
                                 country: '—', city: '—', isp: '—', error: e.message }));
      }
    }

    function isFlagged(r) { return r.vpn || r.proxy || r.tor || r.relay; }

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    function renderBadges(r) {
      if (r.error) return `<span class="badge b-err" title="${esc(r.error)}">ERROR</span>`;
      // GetIPIntel only gives a score — can't distinguish VPN/Proxy/Tor
      if (r.source && r.source.startsWith('GetIPIntel') && isFlagged(r)) {
        return '<div class="badges"><span class="badge b-suspected" title="Flagged by GetIPIntel score — type unknown">SUSPECTED</span></div>';
      }
      const b = [];
      if (r.vpn)   b.push('<span class="badge b-vpn">VPN</span>');
      if (r.proxy) b.push('<span class="badge b-proxy">PROXY</span>');
      if (r.tor)   b.push('<span class="badge b-tor">TOR</span>');
      if (r.relay) b.push('<span class="badge b-relay">RELAY</span>');
      if (!b.length) b.push('<span class="badge b-clean">CLEAN</span>');
      return `<div class="badges">${b.join('')}</div>`;
    }

    function getFlagged() {
      return allResults.filter(r => !r.error && isFlagged(r));
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportFile(format) {
      const flagged = getFlagged();
      if (!flagged.length) return;
      const ts = new Date().toISOString().slice(0, 10);

      if (format === 'txt') {
        downloadFile(
          flagged.map(r => r.ip).join('\n'),
          `flagged-ips-${ts}.txt`,
          'text/plain'
        );
      } else if (format === 'csv') {
        const header = 'IP,VPN,PROXY,TOR,RELAY,COUNTRY,CITY,ISP';
        const rows = flagged.map(r =>
          [r.ip, r.vpn, r.proxy, r.tor, r.relay,
           `"${r.country}"`, `"${r.city}"`,
           `"${r.isp.replace(/"/g, '""')}"`].join(',')
        );
        downloadFile([header, ...rows].join('\n'), `flagged-ips-${ts}.csv`, 'text/csv');
      } else if (format === 'json') {
        const data = flagged.map(r => ({
          ip: r.ip,
          flags: { vpn: r.vpn, proxy: r.proxy, tor: r.tor, relay: r.relay },
          location: { country: r.country, city: r.city },
          isp: r.isp,
        }));
        downloadFile(JSON.stringify(data, null, 2), `flagged-ips-${ts}.json`, 'application/json');
      }
    }

    function toggleProvPanel() {
      const btn  = document.getElementById('prov-toggle');
      const body = document.getElementById('prov-body');
      const open = !body.hidden;
      body.hidden = open;
      btn.classList.toggle('open', !open);
    }

    function renderProviderBreakdown(rows) {
      const panel = document.getElementById('provider-breakdown');
      if (!rows.length) { panel.hidden = true; return; }

      const map = {};
      let unavailable = 0;
      for (const r of rows) {
        // Treat explicit errors AND source='—' (all-providers-failed fallback) as unavailable
        if (r.error || !r.source || r.source === '—') { unavailable++; continue; }
        // GetIPIntel source includes a per-IP score — normalise to just the name
        const src = r.source.startsWith('GetIPIntel') ? 'GetIPIntel' : r.source;
        if (!map[src]) map[src] = { answered: 0, flagged: 0, clean: 0 };
        map[src].answered++;
        if (isFlagged(r)) map[src].flagged++;
        else map[src].clean++;
      }

      let rows_html = Object.entries(map)
        .sort((a, b) => b[1].answered - a[1].answered)
        .map(([src, s]) => {
          const rate = s.answered ? ((s.flagged / s.answered) * 100).toFixed(1) : '0.0';
          const flagCell = s.flagged > 0
            ? `<td class="prov-flag">${s.flagged}</td>`
            : `<td class="prov-dim">0</td>`;
          return `<tr>
            <td class="prov-name">${esc(src)}</td>
            <td>${s.answered}</td>
            ${flagCell}
            <td class="prov-dim">${s.clean}</td>
            <td>${rate}%</td>
          </tr>`;
        }).join('');

      // Append unavailable row last so real providers stay prominent
      if (unavailable > 0) {
        rows_html += `<tr style="opacity:0.55">
          <td class="prov-name" title="All providers were quota-exhausted or unreachable for these IPs">⚠ Unavailable</td>
          <td>${unavailable}</td>
          <td>—</td>
          <td>—</td>
          <td>—</td>
        </tr>`;
      }

      document.getElementById('prov-tbody').innerHTML = rows_html;
      panel.hidden = false;
    }

    function updateStats(rows) {
      const flaggedRows = rows.filter(r => !r.error && isFlagged(r));
      const clean       = rows.filter(r => !r.error && !isFlagged(r)).length;
      document.getElementById('st-total').textContent   = rows.length;
      document.getElementById('st-flagged').textContent = flaggedRows.length;
      document.getElementById('st-clean').textContent   = clean;

      const bar = document.getElementById('export-bar');
      bar.hidden = flaggedRows.length === 0;
      document.getElementById('export-count').textContent = flaggedRows.length;

      renderProviderBreakdown(rows);
    }

    function renderTable(rows) {
      updateStats(rows);
      if (!rows.length) return;

      const tbody = rows.map(r => `
        <tr class="${isFlagged(r) ? 'is-flagged' : ''}">
          <td class="ip-val">${esc(r.ip)}</td>
          <td>${renderBadges(r)}</td>
          <td>${esc(r.country)}</td>
          <td>${esc(r.city)}</td>
          <td style="max-width:220px;word-break:break-word">${esc(r.isp)}</td>
          <td class="prov-dim" style="font-size:0.7rem">${esc(r.source || '—')}</td>
        </tr>`).join('');

      document.getElementById('results-area').innerHTML = `
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>IP Address</th>
                <th>Status</th>
                <th>Country</th>
                <th>City</th>
                <th>ISP / ASN</th>
                <th>Source</th>
              </tr>
            </thead>
            <tbody>${tbody}</tbody>
          </table>
        </div>`;
    }

    async function runScan() {
      if (scanning) return;
      const raw = document.getElementById('ip-input').value;
      const ips = parseIPs(raw);

      if (!ips.length) {
        const ta = document.getElementById('ip-input');
        ta.style.boxShadow = 'inset 0 0 0 2px #FF1500';
        ta.focus();
        setTimeout(() => { ta.style.boxShadow = ''; }, 900);
        return;
      }

      scanning = true;
      allResults = [];
      document.getElementById('scan-btn').disabled = true;
      document.getElementById('st-total').textContent   = '…';
      document.getElementById('st-flagged').textContent = '…';
      document.getElementById('st-clean').textContent   = '…';

      const progWrap = document.getElementById('prog-wrap');
      const progFill = document.getElementById('prog-fill');
      progWrap.style.display = 'block';
      progFill.style.background = 'var(--text)';
      progFill.style.width = '0%';

      // Scale batch size with total IP count to balance responsiveness vs. HTTP overhead
      const BATCH_SIZE = ips.length < 50 ? 5 : 50;
      let done = 0;

      for (let i = 0; i < ips.length; i += BATCH_SIZE) {
        const batch = ips.slice(i, i + BATCH_SIZE);
        const batchRes = await checkBatch(batch);
        allResults.push(...batchRes);
        done += batch.length;
        progFill.style.width = `${(done / ips.length) * 100}%`;
        renderTable([...allResults]);
      }

      progFill.style.background = 'var(--green)';
      setTimeout(() => { progWrap.style.display = 'none'; }, 1200);

      scanning = false;
      document.getElementById('scan-btn').disabled = false;
    }

    document.getElementById('ip-input').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runScan();
    });

    async function openStatus() {
      document.getElementById('status-modal').hidden = false;
      document.getElementById('status-body').innerHTML =
        '<p style="font-size:0.7rem;color:var(--muted)">Loading…</p>';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        const res = await fetch('/api/status', { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`Server returned ${res.status} — deploy may still be in progress`);
        const data = await res.json();
        const STATE = {
          active:    { dot: 'dot-active',    label: 'Active' },
          exhausted: { dot: 'dot-exhausted', label: 'Exhausted' },
          no_key:    { dot: 'dot-nokey',     label: 'No Key' },
        };
        const rows = data.providers.map(p => {
          const s = STATE[p.state] || STATE.no_key;
          return `<div class="prov-status-row">
            <span class="prov-dot ${s.dot}"></span>
            <span class="prov-status-name">${esc(p.name)}</span>
            <span class="prov-state-lbl">${s.label}</span>
          </div>`;
        }).join('');
        document.getElementById('status-body').innerHTML = rows +
          `<button class="reset-btn" onclick="resetProviders()">Reset Exhausted Providers</button>`;
      } catch (e) {
        document.getElementById('status-body').innerHTML =
          `<p style="font-size:0.7rem;color:var(--accent)">Failed to load status: ${esc(e.message)}</p>`;
      }
    }

    function closeStatus() {
      document.getElementById('status-modal').hidden = true;
    }

    async function resetProviders() {
      try {
        await fetch('/api/reset', { method: 'POST' });
        openStatus(); // refresh the list
      } catch (e) {
        alert('Reset failed: ' + e.message);
      }
    }
  </script>

</body>
</html>
